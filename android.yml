 extern BtlTechChr *BtlChar_FindBySide(s32 side);
 extern BtlTechChr *BtlChar_Get(s32 player);
 extern BtlTechObj *BtlChar_GetObj(BtlTechChr *chr);
+
+#ifdef PORT
+#include "battle/port_chara.h"
+extern s32 BattleSide_GetChara(s32 side);
+extern BtlTechMember *BtlMember_GetActive(BtlTechChr *chr);
+
+/* PC build: 1 while the fighter is in an added form (a hidden character slot): it has no transformation of its own. */
+static s32 PortTrans_Locked(BtlTechChr *chr) {
+    return PortChara_IsExtra(BattleSide_GetChara(BtlChar_Get(0) == chr ? 0 : 1));
+}
+
+/* PC build: the added transformation that takes slot `slot` of the fighter's own table, NULL if none. It is
+   offered to the disc character it belongs to, while that slot is free, and only when its files are installed. */
+static const PortCharaSlot *PortTrans_Find(BtlTechChr *chr, s32 slot) {
+    s32 i;
+
+    if (slot < 0 || slot > 3) {
+        return NULL;
+    }
+    for (i = 0; i < PORT_CHARA_COUNT; i++) {
+        const PortCharaSlot *x = &kPortCharaSlots[i];
+
+        if (x->index == slot && x->base == BtlMember_GetActive(chr)->chara &&
+            BtlChar_GetObj(chr)->param->transTarget[slot] == 0xFF && PortChara_Installed(x->id)) {
+            return x;
+        }
+    }
+    return NULL;
+}
+#endif
